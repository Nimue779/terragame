<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <!--ensures the scale looks good on different sized screens-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!--This title will be changed!-->
    <title>Sci-Fi Mystery text game</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="game-container">

        <!--inventory bar-->
        <div id="inventory-bar">Inventory: Empty</div>
        <!--status (health) bar-->
        <div id="stats-bar">Oxygen: 100% | Health: 100%</div>
        
        <div id="text">Loading stasis bay...</div>

        <!-- keypad input area -->
        <div id="keypad-container" style="display: none; margin: 15px 0;">
            <input type="text" id="keypad-input" placeholder="ENTER 4-DIGIT CODE" maxlength="4" style="font-family:monospace; font-size: 1.2rem; padding: 6px; text-align: center; letter-spacing: 4px; background: #000; color: #00ff00; border: 1px solid #00ff00;">
            <button id="keypad-submit" style="margin-left: 8px; padding: 6px 12px; cursor: pointer;">SUBMIT</button>
        </div>

        <div id="button-box" class="btn-grid"></div>

    </div>

    <!--cnnects to js file-->
    <script src="app.js"></script>
</body>
</html>
